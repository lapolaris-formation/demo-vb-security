# Dependabot : mises à jour de version (PR hebdo) pour NuGet (packages.config) et GitHub Actions.
# Fichier du projet jumeau WinVOIE, qui fonctionne, adapté à votre projet WBAO.
# Les alertes de vulnérabilité et les "security updates" s'activent dans Settings > Advanced Security.
version: 2
updates:
  - package-ecosystem: "nuget"
    directories:                   # un packages.config par projet : chaque dossier doit être listé
      - "/WinBAO"                  # votre projet WBAO (dans le jumeau : "/WinVOIE")
      # un autre projet avec son packages.config, par exemple des tests : ajoutez son dossier ici
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    labels: [ "dependances" ]
    commit-message:
      prefix: "build"
      include: "scope"
    # Mineures et correctives regroupées en une seule PR ; les majeures restent séparées
    groups:
      dependances-mineures:
        update-types: [ "minor", "patch" ]
    # Montées majeures figées jusqu'à une migration préparée : dans le jumeau, la version 10.x
    # de ces paquets livrait un exécutable sans Microsoft.Extensions.Logging.Abstractions.dll
    # (démonstration 2). Fin de support de .NET 8 : 10/11/2026.
    ignore:
      - dependency-name: "Microsoft.Extensions.*"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "Microsoft.Bcl.*"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "System.Security.Cryptography.Pkcs"
        update-types: [ "version-update:semver-major" ]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels: [ "dependances", "ci" ]
